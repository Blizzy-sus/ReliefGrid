<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ReliefGrid · Disaster Relief Operations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M16 5l9 5v7c0 5-4 8-9 10-5-2-9-5-9-10v-7z' fill='none' stroke='%234cc9f0' stroke-width='2'/%3E%3Cpath d='M16 11v10M11 16h10' stroke='%23ff5d5d' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Primary">
      <a class="brand" href="#/dashboard" aria-label="ReliefGrid home">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 3l11 6v8c0 6-5 10-11 12C10 27 5 23 5 17V9z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10v12M10 16h12" stroke="var(--crit)" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span><strong>ReliefGrid</strong><small>Relief operations</small></span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="incident" class="incident"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <span class="clock" id="clock" aria-label="Current time"></span>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button>
          <div class="user-chip" id="user-chip"></div>
          <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="login-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite" role="status"></div>
  <script type="module" src="/js/main.js"></script>
  <noscript>ReliefGrid needs JavaScript enabled.</noscript>
</body>
</html>
